name: agri-news-brief (daily watchdog)

on:
  # The 05:50 check can recover a missing 05:35 native trigger before
  # Cloudflare's 06:05 trigger. Later checks enforce the 07:00 delivery SLA.
  schedule:
    - cron: '50 20 * * 0-4'
    - cron: '20,35,50,55 21 * * 0-4'
    # Final audit for delayed GitHub schedule events.
    - cron: '15 0 * * 1-5'
  workflow_run:
    workflows: ['agri-news-brief (daily)']
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check only; do not dispatch a missing daily run'
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: read

concurrency:
  group: agri-news-brief-daily-watchdog
  cancel-in-progress: false

jobs:
  ensure-daily-run:
    if: >-
      github.ref_name == 'main' &&
      (
        github.event_name != 'workflow_run' ||
        (
          github.event.workflow_run.head_branch == 'main' &&
          !contains(github.event.workflow_run.display_title, 'recovery=true')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout recovery policy
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Verify today's delivery and recover if missing
        id: watchdog
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_FILE: daily.yml
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail

          report_date="$(TZ=Asia/Seoul date +%F)"
          receipt_path="docs/delivery/${report_date}.json"
          receipt_file="$RUNNER_TEMP/delivery-receipt.json"
          runs_file="$RUNNER_TEMP/daily-runs.json"
          decision_file="$RUNNER_TEMP/delivery-decision.json"

          if ! gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/${REPO}/contents/${receipt_path}?ref=main" > "$receipt_file" 2>/dev/null; then
            echo '{}' > "$receipt_file"
          fi
          gh api --method GET \
            "repos/${REPO}/actions/workflows/${WORKFLOW_FILE}/runs" \
            -f per_page=30 > "$runs_file"

          python scripts/delivery_watchdog_decision.py \
            --receipt "$receipt_file" \
            --runs "$runs_file" \
            --report-date "$report_date" \
            --dry-run "$DRY_RUN" > "$decision_file"

          action="$(jq -r '.action' "$decision_file")"
          result="$(jq -r '.result' "$decision_file")"
          run_id="$(jq -r '.run_id' "$decision_file")"
          run_url="$(jq -r '.run_url' "$decision_file")"
          run_status="$(jq -r '.run_status' "$decision_file")"
          run_conclusion="$(jq -r '.run_conclusion' "$decision_file")"
          run_age_minutes="$(jq -r '.run_age_minutes' "$decision_file")"
          recovery_run_count="$(jq -r '.recovery_run_count' "$decision_file")"
          receipt_status="$(jq -r '.receipt_status' "$decision_file")"
          receipt_timestamp="$(jq -r '.receipt_timestamp' "$decision_file")"
          delivery_on_time="$(jq -r '.delivery_on_time' "$decision_file")"

          if [[ "$action" == 'cancel_and_dispatch' && -n "$run_id" ]]; then
            echo "Cancelling stale daily run ${run_id} (${run_age_minutes} minutes old)."
            gh api --method POST "repos/${REPO}/actions/runs/${run_id}/cancel" || true
            action='dispatch'
            result='stale-run-recovery-dispatched'
          fi

          if [[ "$action" == 'dispatch' ]]; then
            gh api --method POST \
              "repos/${REPO}/actions/workflows/${WORKFLOW_FILE}/dispatches" \
              -f ref=main \
              -f 'inputs[trigger_source]=github-watchdog' \
              -f 'inputs[quality_recovery]=true' \
              -f 'inputs[force_sla_fallback]=true'
            run_url="https://github.com/${REPO}/actions/workflows/${WORKFLOW_FILE}"
            run_status='dispatched'
            run_conclusion='pending'
            if [[ "$result" != 'stale-run-recovery-dispatched' ]]; then
              result='recovery-dispatched'
            fi
            echo "Delivery receipt was missing; standard-briefing SLA recovery was dispatched."
          elif [[ "$result" == 'daily-run-active' ]]; then
            echo "Delivery receipt is pending while the daily run is active: ${run_url}"
          elif [[ "$result" == 'delivery-confirmed-on-time' ]]; then
            echo "On-time Kakao delivery confirmed: ${receipt_timestamp}"
          elif [[ "$result" == 'delivery-confirmed-late' ]]; then
            echo "::error::Kakao delivery missed the 07:00 KST SLA: ${receipt_timestamp}"
          elif [[ "$result" == 'recovery-attempt-limit-reached' ]]; then
            echo "::error::Delivery is missing after ${recovery_run_count} recovery runs."
          fi

          {
            echo "result=$result"
            echo "report_date=$report_date"
          } >> "$GITHUB_OUTPUT"

          {
            echo '## Daily Watchdog Summary'
            echo "- Report date (KST): $report_date"
            echo "- Result: $result"
            echo "- Delivery receipt: $receipt_path (${receipt_status})"
            echo "- Receipt timestamp: ${receipt_timestamp:-unknown}"
            echo "- Delivered by 07:00 KST: $delivery_on_time"
            echo "- Daily status: $run_status/$run_conclusion (age=${run_age_minutes}m)"
            echo "- Recovery runs today: $recovery_run_count/2"
            if [[ -n "$run_url" ]]; then
              echo "- Daily run: $run_url"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$result" == 'delivery-confirmed-late' || "$result" == 'recovery-attempt-limit-reached' ]]; then
            exit 1
          fi
